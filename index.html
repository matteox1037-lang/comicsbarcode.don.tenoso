<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Comics Booklet | Credits</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f8fafc; font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at 15% 15%, #374151 0 2px, transparent 3px),
                  radial-gradient(circle at 80% 70%, #374151 0 2px, transparent 3px),
                  linear-gradient(145deg, #0b1020, #1f2937 55%, #111827);
      background-size: 22px 22px, 26px 26px, auto;
    }
    .card {
      width: min(100%, 560px); padding: 38px 28px; text-align: center;
      background: rgba(17, 24, 39, .94); border: 2px solid #facc15;
      border-radius: 22px; box-shadow: 9px 9px 0 #000;
    }
    .tag { display: inline-block; padding: 7px 13px; border-radius: 6px;
      background: #facc15; color: #111827; font-weight: 900;
      letter-spacing: 2px; font-size: 12px; transform: rotate(-2deg); }
    h1 { margin: 22px 0 8px; font-size: clamp(30px, 8vw, 44px); line-height: 1.05; }
    .subtitle { color: #cbd5e1; margin: 0 0 28px; }
    .divider { height: 3px; width: 72px; background: #facc15; margin: 0 auto 26px; }
    .label { color: #facc15; text-transform: uppercase; letter-spacing: 2px;
      font-size: 11px; font-weight: 800; margin: 20px 0 8px; }
    .value { font-size: 21px; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
    .subject { color: #cbd5e1; font-size: 16px; }
    footer { margin-top: 32px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">COMIC BOOKLET</span>
    <h1>THE END.<br>THE CREDITS.</h1>
    <p class="subtitle">Thank you for reading my comic!</p>
    <div class="divider"></div>
    <p class="label">Created by</p>
    <p class="value">Daniel Matthew L. Jarito</p>
    <p class="label">Submitted to</p>
    <p class="value">Mrs. Leicel Nazaret</p>
    <p class="label">Subject</p>
    <p class="value subject">Filipino</p>
    <footer>© 2026 · Comic Booklet Credits</footer>
  </main>
</body>
</html>
